<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Map Explorer</title>

    <!-- Vendor: Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Vendor: Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Vendor: Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- App: Main UI / layout / dark theme -->
    <link rel="stylesheet" href="css/main.css">
    <!-- App: Map-specific overrides (legend, popups, controls) -->
    <link rel="stylesheet" href="css/map.css">
</head>
<body>
    <div id="app">
        <!-- Mobile Toggle Button -->
        <button id="toggle-sidebar" aria-label="Toggle sidebar" title="Toggle filters">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- ============================================================
             SIDEBAR — Filters &amp; Location List
             ============================================================ -->
        <aside id="sidebar">
            <!-- Header -->
            <div class="sidebar-header">
                <div class="sidebar-header-row">
                    <div>
                        <h2><i class="fa-solid fa-map-location-dot"></i> Map Explorer</h2>
                        <div class="subtitle" id="header-subtitle"></div>
                    </div>
                    <button class="btn-reset-all" id="btn-reset-all" title="Reset all filters to defaults">
                        <i class="fa-solid fa-arrow-rotate-left"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Category Filters -->
            <div class="filter-section">
                <div class="section-label"><i class="fa-solid fa-tags"></i>&nbsp; Categories</div>
                <div class="category-filters" id="category-filters">
                    <!-- Dynamically populated by app.js from unique categories in config -->
                </div>
            </div>

            <!-- Radius Zone Filters (multi-select) — populated from config -->
            <div class="filter-section">
                <div class="section-label"><i class="fa-solid fa-bullseye"></i>&nbsp; Radius Zones</div>
                <div class="radius-filters" id="radius-filters">
                    <!-- Dynamically populated by app.js -->
                </div>
            </div>

            <!-- Results Summary -->
            <div class="results-summary">
                <span>Showing <span class="results-count" id="results-count">0</span> locations</span>
            </div>

            <!-- Location Cards List -->
            <div class="location-list" id="location-list">
                <!-- Dynamically populated by app.js -->
            </div>
        </aside>

        <!-- ============================================================
             MAP CONTAINER
             ============================================================ -->
        <div id="map-container">
            <div id="map"></div>

            <!-- Legend Overlay — items populated from config -->
            <div id="legend">
                <div class="legend-title">Radius Zones</div>
                <!-- Dynamically populated by app.js -->
            </div>
        </div>
    </div>

    <!-- ============================================================
         SCRIPTS  (order matters: map.js → app.js)
         ============================================================ -->
    <!-- Vendor: Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Vendor: Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App: Map engine (Leaflet initialisation, markers, layers) -->
    <script src="js/map.js"></script>
    <!-- App: UI logic, state management, event handlers, sidebar cards -->
    <script src="js/app.js"></script>
</body>
</html>
